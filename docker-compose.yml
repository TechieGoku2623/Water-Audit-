version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dc-water-audit-postgres
    environment:
      POSTGRES_USER: water_audit
      POSTGRES_PASSWORD: water_audit
      POSTGRES_DB: water_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_audit -d water_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
